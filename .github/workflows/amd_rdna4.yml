# genesis-world CI — AMD RDNA4 (R9700) leg.
# Nightly auto-mode: checks out UPSTREAM main and runs the GPU test suite on an
# AMD RDNA4 self-hosted runner (labels: self-hosted, amd, rdna4), so it tracks
# the latest upstream without needing to sync this fork.
#
# NOTE: schedule/workflow_dispatch only fire from the repo DEFAULT branch, so this
# file must live on the fork's default branch (main).
#
# Prereq: a self-hosted runner on the R9700 host with labels [self-hosted, amd, rdna4].
# The host only needs docker + ROCm driver (/dev/kfd, /dev/dri); tests run in a container.
#
# Networking: the runner is outbound-only (polls GitHub); no inbound port is opened,
# so the intranet node is not exposed. No fork-PR code runs (no pull_request trigger);
# only upstream main is executed, inside a --rm container.
name: AMD RDNA4 (R9700)

on:
  workflow_dispatch: {}
  schedule:
    # 02:00 CST (18:00 UTC) nightly.
    - cron: "0 18 * * *"

concurrency:
  group: amd-rdna4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd-rdna4-tests:
    name: rdna4-required
    runs-on: [self-hosted, amd, rdna4]
    timeout-minutes: 120

    env:
      # genesis-amd image validated on R9700 (ROCm + render deps).
      GENESIS_AMD_IMAGE: genesis-amd:latest
      HIP_VISIBLE_DEVICES: "0"

    steps:
      - name: Checkout upstream genesis-world @ main
        uses: actions/checkout@v4
        with:
          repository: Genesis-Embodied-AI/genesis-world
          ref: main

      - name: GPU + backend sanity
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --security-opt seccomp=unconfined --ipc=host \
            -e HIP_VISIBLE_DEVICES \
            "$GENESIS_AMD_IMAGE" bash -lc '
              rocm-smi --showproductname || true
              python -c "import genesis as gs; gs.init(backend=gs.gpu)"
            '

      - name: Run required GPU tests
        run: |
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri \
            --group-add video --group-add render \
            --security-opt seccomp=unconfined --ipc=host \
            -e HIP_VISIBLE_DEVICES \
            -e PYOPENGL_PLATFORM=egl \
            -e QD_ENABLE_AMDGPU=1 \
            -e FORCE_COLOR=1 -e PY_COLORS=1 \
            -v "${{ github.workspace }}":/workspace/genesis \
            -w /workspace/genesis \
            "$GENESIS_AMD_IMAGE" bash -lc '
              set -ex
              pip install -e ".[dev,render]"
              # Single GPU: disable xdist parallelism (-n0) to avoid GPU contention;
              # --forked isolates each test in its own process.
              pytest -v -ra --backend gpu --dev -m "required and not slow" --forked -n0 ./tests
            '
